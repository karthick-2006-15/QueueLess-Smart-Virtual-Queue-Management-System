<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | QueueLess</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-main) 0%, #E0E7FF 100%);
      padding: 2rem;
    }

    .auth-card {
      width: 100%;
      max-width: 450px;
      padding: 3rem 2rem;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .auth-header h1 {
      font-size: 2rem;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="glass-card auth-card fade-in">
      <div class="auth-header">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1.5rem;">
          <i class="fa-solid fa-layer-group" style="color: var(--primary);"></i> Queue<span>Less</span>
        </a>
        <h1>Welcome Back</h1>
        <p class="text-muted">Enter your credentials to access your account</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="student@college.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            <i class="fa-regular fa-eye toggle-password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);"></i>
          </div>
        </div>

        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox"> Remember me
          </label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Login
        </button>
      </form>

      <div class="text-center mt-3" style="font-size: 0.875rem;">
        <p class="text-muted">Don't have an account? <a href="register.html" style="font-weight: 600;">Sign up</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
