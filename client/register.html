<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | QueueLess</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-main) 0%, #E0E7FF 100%);
      padding: 2rem;
    }

    .auth-card {
      width: 100%;
      max-width: 500px;
      padding: 3rem 2rem;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .auth-header h1 {
      font-size: 2rem;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="glass-card auth-card fade-in">
      <div class="auth-header">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1.5rem;">
          <i class="fa-solid fa-layer-group" style="color: var(--primary);"></i> Queue<span>Less</span>
        </a>
        <h1>Create an Account</h1>
        <p class="text-muted">Join the smart way to wait</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="studentId">Student ID</label>
            <input type="text" id="studentId" class="form-control" placeholder="12345678" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="+1 234 567 8900">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="student@college.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Create Account
        </button>
      </form>

      <div class="text-center mt-3" style="font-size: 0.875rem;">
        <p class="text-muted">Already have an account? <a href="login.html" style="font-weight: 600;">Log in</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
